start:
  name: Start trader
  description: Reconcile and recover the trader, then leave the normal Home Assistant coordinator in control of cycles.
stop:
  name: Stop trading
  description: Activate a safe stop without cancelling existing exchange positions.
reconcile:
  name: Reconcile portfolio and orders
  description: Reconcile exchange truth into the local materialized state.

recover:
  name: Recover trader
  description: Recheck Kraken state, rediscover instruments and clear the circuit breaker only after reconciliation succeeds.
