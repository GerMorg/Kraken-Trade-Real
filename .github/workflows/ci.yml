name: Kraken Trade Real CI

on:
  push:
    branches:
      - main
      - "rebuild/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kraken_trade_real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kraken_trade_real/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff check app tests
      - run: mypy app --ignore-missing-imports
      - run: python -m pytest -q

  security:
    name: Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kraken_trade_real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: bandit -q -r app
      - run: pip-audit

  ha_structure:
    name: Home Assistant structure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kraken_trade_real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python ../scripts/validate_ha_app.py

  compile:
    name: Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kraken_trade_real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q app tests

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f kraken_trade_real/Dockerfile -t kraken-trade-real:ci kraken_trade_real
