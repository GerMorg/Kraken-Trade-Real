name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e . pytest pytest-cov ruff
      - name: Lint
        run: ruff check .
      - name: Syntax
        run: python -m compileall -q custom_components tests
      - name: Tests
        run: pytest --cov=custom_components/kraken_ai_trader/core --cov-report=term-missing --cov-fail-under=85
      - name: JSON validation
        run: python - <<'PY'
        import json
        from pathlib import Path
        for p in Path('.').rglob('*.json'):
            json.loads(p.read_text())
        print('JSON OK')
        PY
