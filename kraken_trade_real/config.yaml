name: Kraken Trade Real
version: 0.1.27
slug: kraken_trade_real
description: >-
  Autonomous, auditierbarer Kraken-Trader mit dynamischer Marktselektion,
  Long/Short, Margin, Leverage, News, Gemini, Learning und Home-Assistant-Sensoren.
arch:
  - amd64
  - aarch64
url: https://github.com/GerMorg/Kraken-Trade-Real
startup: application
boot: auto
homeassistant: "2026.4.0"
homeassistant_api: true
hassio_role: default
apparmor: true
init: false
map:
  - type: addon_config
    read_only: false
options:
  kraken_api_key: ""
  kraken_api_secret: ""
  futures_enabled: false
  futures_api_key: ""
  futures_api_secret: ""
  tokenized_assets_enabled: false
  kraken_enabled: true
  live_enabled: false
  kill_switch: true
  gemini_api_key: ""
  gemini_enabled: true
  gemini_model: gemini-3.8-flash
  gemini_fallback_models: "gemini-3.5-flash-lite,gemini-3.6-flash,gemini-2.5-flash-lite"
  gemini_timeout_seconds: 30
  market_scan_interval_seconds: 300
  market_min_liquidity_eur: 50.0
  market_max_spread_bps: 80.0
  market_max_data_age_seconds: 30
  market_history_candidate_limit: 200
  market_history_cache_seconds: 900
  market_exploration_candidate_limit: 80
  market_exploration_slots_per_family: 2
  strategy_min_edge_bps: 25.0
  strategy_min_confidence: 0.58
  risk_max_position_pct: 15.0
  risk_max_gross_pct: 80.0
  risk_max_net_pct: 50.0
  risk_max_margin_pct: 35.0
  risk_max_leverage: 3.0
  risk_max_open_positions: 3
  risk_daily_loss_pct: 3.0
  risk_max_drawdown_pct: 8.0
  risk_cash_reserve_pct: 20.0
  execution_max_slippage_bps: 40.0
  execution_fx_cost_bps: 40.0
  execution_allow_position_funding: true
  execution_fx_position_switch_min_edge_bps: 250.0
  execution_position_funding_cost_bps: 40.0
  execution_order_timeout_seconds: 45
  execution_max_reprices: 2
  execution_max_orders_per_day: 10
  execution_reconciliation_limit: 20
  execution_reconciliation_stale_seconds: 30
  learning_enabled: true
  learning_lookback_days: 365
  learning_validation_interval_hours: 24
  learning_auto_calibration: true
  learning_auto_promotion: true
  news_enabled: true
  news_refresh_minutes: 10
  news_source_timeout_seconds: 10
  sensors_enabled: true
  log_file_enabled: true
  tax_enabled: true
  tax_provider_classification: "FOREIGN"
  tax_report_enabled: true
  tactical_enabled: false
  tactical_shadow_mode: true
  tactical_allow_short: true
  tactical_portfolio_pct: 25.0
